name: CI/CD Pipeline 🚀

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format 🧹
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
  
    - name: Set up Python ⚙️
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install Ruff 🦀
      run: python -m pip install ruff

    - name: Lint and Format 🫧
      run: |
        ruff check . --output-format=github
        ruff format --check .

  commitlint:
    name: Lint Commit Messages 💬
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 💛
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install commitlint 📦
        run: npm install -D @commitlint/cli @commitlint/config-conventional

      - name: Validate PR commits with commitlint 🔍
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build:
    name: Build test distribution 📦
    needs: [lint, commitlint]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python ⚙️
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
        cache: "pip"

    - name: Install build tools 📦
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build sdist and wheel ⚙️
      run: python -m build

    - name: Store distribution packages 📥
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  test:
    name: Test on Python ${{ matrix.python-version }} 🐍
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }} ⚙️
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download the dists 📥
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Install dependencies and package 📦
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest coverage
        
        WHEEL_FILE=$(ls dist/*.whl)
        python -m pip install "${WHEEL_FILE}[all]"

    - name: Run tests (No Coverage) 🧪
      if: matrix.python-version != '3.14'
      run: python -m pytest -v

    - name: Run tests (With Coverage) 🧪📊
      if: matrix.python-version == '3.14'
      run: |
        python -m coverage run -m pytest -v
        python -m coverage report -m
        python -m coverage json
        
        TOTAL=$(jq '(.totals.percent_covered | floor)' coverage.json)
        echo "total=$TOTAL" >> $GITHUB_ENV
        
        if [ "$TOTAL" -ge 95 ]; then
          echo "color=brightgreen" >> $GITHUB_ENV
        elif [ "$TOTAL" -ge 90 ]; then
          echo "color=green" >> $GITHUB_ENV
        elif [ "$TOTAL" -ge 85 ]; then
          echo "color=yellowgreen" >> $GITHUB_ENV
        elif [ "$TOTAL" -ge 80 ]; then
          echo "color=yellow" >> $GITHUB_ENV
        elif [ "$TOTAL" -ge 70 ]; then
          echo "color=orange" >> $GITHUB_ENV
        else
          echo "color=red" >> $GITHUB_ENV
        fi

    - name: Update Coverage Badge Gist 🪪
      if: matrix.python-version == '3.14'
      uses: Schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 9f30f8200703cf6886ab323e86b9f0a1
        filename: pyansistring_coverage.json
        label: coverage
        message: ${{ env.total }}%
        color: ${{ env.color }}

  release:
    name: Run Semantic Release 🌸
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      published: ${{ steps.semantic.outputs.published }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node.js 💛
      uses: actions/setup-node@v6
      with:
        node-version: "lts/*"

    - name: Set up Python ⚙️
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install build tools 📦
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Semantic Release 🌸
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release

    - name: Check if release was published 🤔
      id: semantic
      run: |
        if [ "$RELEASE_CREATED" = "true" ]; then
          echo "published=true" >> $GITHUB_OUTPUT
        fi

    - name: Store final distribution packages 📥
      if: steps.semantic.outputs.published == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: release-dists
        path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyansistring
    permissions:
      id-token: write

    steps:
    - name: Download release dists 📥
      uses: actions/download-artifact@v8
      with:
        name: release-dists
        path: dist/

    - name: Publish distribution 📦 to PyPI 🚀
      uses: pypa/gh-action-pypi-publish@release/v1
